<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="LuL's Website">
<title>LuL's Website</title>
<link rel="icon" href="assets/icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<link rel="stylesheet" href="assets/common.css">
<script>document.documentElement.classList.add('js')</script>
<style>
.top {
  padding-top: clamp(88px, 12vw, 120px);
  padding-bottom: clamp(40px, 6vw, 72px);
}

h1 {
  font-size: clamp(48px, 11vw, 120px);
  line-height: 1.05;
  font-weight: 800;
  letter-spacing: -.035em;
}

.sub {
  margin-top: 16px;
  font-size: 13px;
  letter-spacing: .14em;
  color: var(--muted);
}

.list {
  list-style: none;
  border-top: 1px solid var(--line);
  margin-bottom: clamp(64px, 10vw, 120px);
}

.list li {
  border-bottom: 1px solid var(--line);
}

.item {
  display: grid;
  grid-template-columns: auto 1fr auto;
  align-items: center;
  gap: clamp(16px, 3vw, 36px);
  padding: clamp(16px, 2.5vw, 24px) 0;
}

.thumb {
  position: relative;
  width: clamp(104px, 24vw, 240px);
  aspect-ratio: 4 / 3;
  overflow: hidden;
  border-radius: clamp(10px, 1.6vw, 18px);
  background: linear-gradient(160deg, var(--photo-a), var(--photo-b) 55%, var(--photo-c));
}

.thumb img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  filter: saturate(.9) contrast(.94) brightness(1.04);
  transition: transform .9s var(--ease);
}

.thumb:empty::after {
  content: "?";
  position: absolute;
  inset: 0;
  display: grid;
  place-items: center;
  color: var(--muted);
  font-size: clamp(20px, 3vw, 32px);
  font-weight: 700;
}

h2 {
  font-size: clamp(22px, 4vw, 40px);
  line-height: 1.2;
  font-weight: 800;
  letter-spacing: -.02em;
}

.arrow {
  font-size: clamp(20px, 3vw, 28px);
  transition: transform .3s var(--ease);
}

a.item:hover .thumb img {
  transform: scale(1.05);
}

a.item:hover .arrow {
  transform: translateX(6px);
}

.soon {
  opacity: .45;
}

.cast-names {
  margin-top: 6px;
  font-size: clamp(13px, 1.6vw, 15px);
  color: var(--muted);
}

.menu-btn {
  position: fixed;
  top: 16px;
  right: 16px;
  z-index: 95;
  display: grid;
  place-content: center;
  gap: 5px;
  width: 48px;
  height: 48px;
  border: 1px solid var(--line);
  border-radius: 50%;
  background: var(--bg);
  cursor: pointer;
}

.menu-btn span {
  display: block;
  width: 18px;
  height: 1.5px;
  background: var(--text);
  transition: transform .45s var(--ease), opacity .3s;
}

.menu-open .menu-btn span:nth-child(1) {
  transform: translateY(6.5px) rotate(45deg);
}

.menu-open .menu-btn span:nth-child(2) {
  opacity: 0;
}

.menu-open .menu-btn span:nth-child(3) {
  transform: translateY(-6.5px) rotate(-45deg);
}

.menu-backdrop {
  position: fixed;
  inset: 0;
  z-index: 93;
  background: rgba(0, 0, 0, .28);
  opacity: 0;
  pointer-events: none;
  transition: opacity .45s;
}

.menu {
  position: fixed;
  top: 0;
  right: 0;
  bottom: 0;
  z-index: 94;
  display: flex;
  flex-direction: column;
  width: min(360px, 86vw);
  padding: 96px 28px 28px;
  overflow-y: auto;
  background: var(--bg);
  border-left: 1px solid var(--line);
  transform: translateX(100%);
  visibility: hidden;
  transition: transform .5s var(--ease), visibility 0s .5s;
}

.menu:focus {
  outline: none;
}

.menu-open {
  overflow: hidden;
}

.menu-open .menu-backdrop {
  opacity: 1;
  pointer-events: auto;
}

.menu-open .menu {
  transform: none;
  visibility: visible;
  transition: transform .5s var(--ease);
}

.menu-links a {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 16px;
  padding: 18px 2px;
  border-bottom: 1px solid var(--line);
  font-size: 18px;
  font-weight: 700;
  opacity: 0;
  transform: translateX(24px);
  transition: opacity .5s var(--ease), transform .5s var(--ease);
}

.menu-links a:first-child {
  border-top: 1px solid var(--line);
}

.menu-open .menu-links a {
  opacity: 1;
  transform: none;
  transition-delay: calc(.12s + var(--i) * .06s);
}

.menu-links .arrow {
  font-size: 18px;
}

.menu-links a:hover .arrow {
  transform: translateX(6px);
}

.menu-setting {
  display: inline-flex;
  align-items: center;
  align-self: flex-start;
  gap: 6px;
  margin-top: auto;
  padding-top: 32px;
  font-size: 13px;
  color: var(--muted);
  transition: color .3s;
}

.menu-setting:hover {
  color: var(--text);
}

.menu-setting svg {
  width: 15px;
  height: 15px;
}

@media (min-width: 768px) {
  .menu-btn {
    top: 24px;
    right: 24px;
  }
}

@media (prefers-reduced-motion: reduce) {
  .menu-btn span,
  .menu-backdrop,
  .menu,
  .menu-open .menu,
  .menu-links a {
    transition: none;
  }
}
</style>
</head>
<body data-view="home">

<button class="menu-btn" type="button" aria-label="메뉴 열기" aria-expanded="false" aria-controls="menu"><span></span><span></span><span></span></button>
<div class="menu-backdrop"></div>
<aside class="menu" id="menu" tabindex="-1" aria-label="메뉴">
  <nav class="menu-links" id="menu-links"></nav>

</aside>

<header class="top wrap">
  <h1 class="reveal" data-site-title>LuL's Website</h1>
  <p class="sub reveal" data-site-sub>플롯 모음집입니다.</p>
</header>

<main class="wrap">
  <ul class="list" id="plots"></ul>
</main>

<footer class="wrap">
  <span>© 2026 Lu</span>
</footer>

<script src="assets/boot.js"></script>
</body>
</html>
