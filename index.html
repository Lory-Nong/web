<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="LuL's Website">
<title>LuL's Website</title>
<link rel="icon" href="assets/icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<link rel="stylesheet" href="assets/common.css">
<script>document.documentElement.classList.add('js');try{var t=localStorage.getItem('lul-theme');if(t)document.documentElement.dataset.theme=t}catch(e){}</script>
<style>
.top {
  padding-top: clamp(88px, 12vw, 120px);
  padding-bottom: clamp(40px, 6vw, 72px);
}

h1 {
  font-size: clamp(48px, 11vw, 120px);
  line-height: 1.05;
  font-weight: 800;
  letter-spacing: -.035em;
}

.sub {
  margin-top: 16px;
  font-size: 13px;
  letter-spacing: .14em;
  color: var(--muted);
}

.list {
  list-style: none;
  border-top: 1px solid var(--line);
  margin-bottom: clamp(64px, 10vw, 120px);
}

.list li {
  position: relative;
  border-bottom: 1px solid var(--line);
}

.notice {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 12px;
  margin-bottom: 28px;
  padding: 14px 14px 14px 18px;
  border: 1px solid var(--line);
  border-left: 3px solid var(--accent);
  border-radius: 14px;
  font-size: 15px;
  white-space: pre-line;
}

.notice button,
.fav,
.tool {
  display: inline-grid;
  place-items: center;
  border: 1px solid var(--line);
  background: var(--bg);
  color: var(--text);
  cursor: pointer;
  transition: border-color .25s, color .25s, transform .25s var(--ease);
}

.notice button {
  flex: none;
  width: 28px;
  height: 28px;
  border: none;
  border-radius: 50%;
  color: var(--muted);
}

.notice svg,
.fav svg {
  width: 16px;
  height: 16px;
}

.tools {
  display: flex;
  gap: 8px;
  margin-bottom: 14px;
}

.search {
  display: flex;
  flex: 1;
  align-items: center;
  gap: 10px;
  min-width: 0;
  height: 48px;
  padding: 0 18px;
  border: 1px solid var(--line);
  border-radius: 999px;
  color: var(--muted);
  transition: border-color .25s;
}

.search:focus-within {
  border-color: var(--text);
}

.search svg {
  flex: none;
  width: 18px;
  height: 18px;
}

.search input {
  width: 100%;
  min-width: 0;
  border: none;
  outline: none;
  background: none;
  color: var(--text);
  font: inherit;
  font-size: 16px;
}

.search input::-webkit-search-cancel-button {
  display: none;
}

.tool {
  grid-auto-flow: column;
  gap: 8px;
  flex: none;
  height: 48px;
  padding: 0 18px;
  border-radius: 999px;
  font: inherit;
  font-size: 14px;
  font-weight: 600;
}

.tool:hover {
  border-color: var(--text);
}

.tool svg {
  width: 18px;
  height: 18px;
  transition: transform .5s var(--ease);
}

.tool:hover svg {
  transform: rotate(90deg);
}

.filters {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  margin-bottom: 18px;
}

.filter {
  height: 34px;
  padding: 0 14px;
  border: 1px solid var(--line);
  border-radius: 999px;
  background: none;
  color: var(--muted);
  font: inherit;
  font-size: 13px;
  font-weight: 600;
  cursor: pointer;
  transition: background-color .25s, color .25s, border-color .25s;
}

.filter:hover {
  border-color: var(--text);
  color: var(--text);
}

.filter.on {
  border-color: var(--text);
  background: var(--text);
  color: var(--bg);
}

.status {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  margin-bottom: 12px;
  font-size: 13px;
  color: var(--muted);
}

.sorts {
  display: flex;
  gap: 12px;
}

.sort {
  padding: 4px 0;
  border: none;
  background: none;
  color: var(--muted);
  font: inherit;
  cursor: pointer;
  transition: color .25s;
}

.sort.on,
.sort:hover {
  color: var(--text);
}

.sort.on {
  font-weight: 700;
}

.empty {
  padding: 72px 0 120px;
  color: var(--muted);
  text-align: center;
}

.fav {
  position: absolute;
  top: calc(clamp(16px, 2.5vw, 24px) + 6px);
  left: 6px;
  z-index: 2;
  width: 34px;
  height: 34px;
  border: none;
  border-radius: 50%;
  background: rgba(0, 0, 0, .42);
  color: #ffffff;
  backdrop-filter: blur(6px);
  -webkit-backdrop-filter: blur(6px);
}

.fav:hover {
  transform: scale(1.1);
}

.fav.on svg {
  fill: currentColor;
}

.new {
  position: absolute;
  right: 6px;
  bottom: 6px;
  padding: 2px 8px;
  border-radius: 999px;
  background: var(--accent);
  color: #ffffff;
  font-size: 11px;
  font-weight: 800;
  letter-spacing: .06em;
}

.tags {
  margin-top: 6px;
  font-size: clamp(12px, 1.4vw, 14px);
  color: var(--accent);
}

.menu-foot {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  margin-top: auto;
  padding-top: 32px;
}

.menu-theme {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 0;
  border: none;
  background: none;
  color: var(--muted);
  font: inherit;
  font-size: 13px;
  cursor: pointer;
  transition: color .3s;
}

.menu-theme:hover {
  color: var(--text);
}

.menu-theme svg {
  width: 15px;
  height: 15px;
}

.item {
  display: grid;
  grid-template-columns: auto 1fr auto;
  align-items: center;
  gap: clamp(16px, 3vw, 36px);
  padding: clamp(16px, 2.5vw, 24px) 0;
}

.thumb {
  position: relative;
  width: clamp(104px, 24vw, 240px);
  aspect-ratio: 4 / 3;
  overflow: hidden;
  border-radius: clamp(10px, 1.6vw, 18px);
  background: linear-gradient(160deg, var(--photo-a), var(--photo-b) 55%, var(--photo-c));
}

.thumb img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  filter: saturate(.9) contrast(.94) brightness(1.04);
  transition: transform .9s var(--ease);
}

.thumb:empty::after {
  content: "?";
  position: absolute;
  inset: 0;
  display: grid;
  place-items: center;
  color: var(--muted);
  font-size: clamp(20px, 3vw, 32px);
  font-weight: 700;
}

h2 {
  font-size: clamp(22px, 4vw, 40px);
  line-height: 1.2;
  font-weight: 800;
  letter-spacing: -.02em;
}

.arrow {
  font-size: clamp(20px, 3vw, 28px);
  transition: transform .3s var(--ease);
}

a.item:hover .thumb img {
  transform: scale(1.05);
}

a.item:hover .arrow {
  transform: translateX(6px);
}

.soon {
  opacity: .45;
}

.cast-names {
  margin-top: 6px;
  font-size: clamp(13px, 1.6vw, 15px);
  color: var(--muted);
}

.menu-btn {
  position: fixed;
  top: 16px;
  right: 16px;
  z-index: 95;
  display: grid;
  place-content: center;
  gap: 5px;
  width: 48px;
  height: 48px;
  border: 1px solid var(--line);
  border-radius: 50%;
  background: var(--bg);
  cursor: pointer;
}

.menu-btn span {
  display: block;
  width: 18px;
  height: 1.5px;
  background: var(--text);
  transition: transform .45s var(--ease), opacity .3s;
}

.menu-open .menu-btn span:nth-child(1) {
  transform: translateY(6.5px) rotate(45deg);
}

.menu-open .menu-btn span:nth-child(2) {
  opacity: 0;
}

.menu-open .menu-btn span:nth-child(3) {
  transform: translateY(-6.5px) rotate(-45deg);
}

.menu-backdrop {
  position: fixed;
  inset: 0;
  z-index: 93;
  background: rgba(0, 0, 0, .28);
  opacity: 0;
  pointer-events: none;
  transition: opacity .45s;
}

.menu {
  position: fixed;
  top: 0;
  right: 0;
  bottom: 0;
  z-index: 94;
  display: flex;
  flex-direction: column;
  width: min(360px, 86vw);
  padding: 96px 28px 28px;
  overflow-y: auto;
  background: var(--bg);
  border-left: 1px solid var(--line);
  transform: translateX(100%);
  visibility: hidden;
  transition: transform .5s var(--ease), visibility 0s .5s;
}

.menu:focus {
  outline: none;
}

.menu-open {
  overflow: hidden;
}

.menu-open .menu-backdrop {
  opacity: 1;
  pointer-events: auto;
}

.menu-open .menu {
  transform: none;
  visibility: visible;
  transition: transform .5s var(--ease);
}

.menu-links a {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 16px;
  padding: 18px 2px;
  border-bottom: 1px solid var(--line);
  font-size: 18px;
  font-weight: 700;
  opacity: 0;
  transform: translateX(24px);
  transition: opacity .5s var(--ease), transform .5s var(--ease);
}

.menu-links a:first-child {
  border-top: 1px solid var(--line);
}

.menu-open .menu-links a {
  opacity: 1;
  transform: none;
  transition-delay: calc(.12s + var(--i) * .06s);
}

.menu-links .arrow {
  font-size: 18px;
}

.menu-links a:hover .arrow {
  transform: translateX(6px);
}

.menu-setting {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  font-size: 13px;
  color: var(--muted);
  transition: color .3s;
}

.menu-setting:hover {
  color: var(--text);
}

.menu-setting svg {
  width: 15px;
  height: 15px;
}

@media (min-width: 768px) {
  .menu-btn {
    top: 24px;
    right: 24px;
  }
}

@media (prefers-reduced-motion: reduce) {
  .menu-btn span,
  .menu-backdrop,
  .menu,
  .menu-open .menu,
  .menu-links a {
    transition: none;
  }
}
</style>
</head>
<body data-view="home">

<button class="menu-btn" type="button" aria-label="메뉴 열기" aria-expanded="false" aria-controls="menu"><span></span><span></span><span></span></button>
<div class="menu-backdrop"></div>
<aside class="menu" id="menu" tabindex="-1" aria-label="메뉴">
  <nav class="menu-links" id="menu-links"></nav>
  <div class="menu-foot">
  <button class="menu-theme" type="button" id="theme-btn"></button>
  <a class="menu-setting" href="Developer/"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>설정</a>
  </div>
</aside>

<header class="top wrap">
  <h1 class="reveal" data-site-title>LuL's Website</h1>
  <p class="sub reveal" data-site-sub>플롯 모음집입니다.</p>
</header>

<main class="wrap">
  <div class="notice" id="notice" role="note" hidden><span id="notice-text"></span><button type="button" id="notice-close" aria-label="공지 닫기"></button></div>
  <div class="tools">
    <label class="search"><span id="search-icon" style="display:contents"></span><input type="search" id="q" placeholder="제목, 캐릭터, 태그 검색" autocomplete="off" aria-label="플롯 검색"></label>
    <button class="tool" type="button" id="random"></button>
  </div>
  <div class="filters" id="filters"></div>
  <div class="status">
    <span id="count"></span>
    <div class="sorts" id="sorts">
      <button class="sort" type="button" data-sort="">기본순</button>
      <button class="sort" type="button" data-sort="latest">최신순</button>
      <button class="sort" type="button" data-sort="name">가나다순</button>
    </div>
  </div>
  <ul class="list" id="plots"></ul>
  <p class="empty" id="empty" hidden>찾는 플롯이 없어요.</p>
</main>

<footer class="wrap">
  <span>© 2026 Lu</span>
</footer>

<script src="assets/boot.js"></script>
</body>
</html>
