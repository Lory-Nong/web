<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="LuL's Website">
<title>LuL's Website</title>
<link rel="icon" href="assets/icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<link rel="stylesheet" href="assets/common.css">
<script>document.documentElement.classList.add('js')</script>
<style>
.top {
  padding-top: clamp(56px, 10vw, 120px);
  padding-bottom: clamp(40px, 6vw, 72px);
}

h1 {
  font-size: clamp(48px, 11vw, 120px);
  line-height: 1.05;
  font-weight: 800;
  letter-spacing: -.035em;
}

.sub {
  margin-top: 16px;
  font-size: 13px;
  letter-spacing: .14em;
  color: var(--muted);
}

.list {
  list-style: none;
  border-top: 1px solid var(--line);
  margin-bottom: clamp(64px, 10vw, 120px);
}

.list li {
  border-bottom: 1px solid var(--line);
}

.item {
  display: grid;
  grid-template-columns: auto 1fr auto;
  align-items: center;
  gap: clamp(16px, 3vw, 36px);
  padding: clamp(16px, 2.5vw, 24px) 0;
}

.thumb {
  position: relative;
  width: clamp(104px, 24vw, 240px);
  aspect-ratio: 4 / 3;
  overflow: hidden;
  border-radius: clamp(10px, 1.6vw, 18px);
  background: linear-gradient(160deg, var(--photo-a), var(--photo-b) 55%, var(--photo-c));
}

.thumb img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  filter: saturate(.9) contrast(.94) brightness(1.04);
  transition: transform .9s var(--ease);
}

.thumb:empty::after {
  content: "?";
  position: absolute;
  inset: 0;
  display: grid;
  place-items: center;
  color: var(--muted);
  font-size: clamp(20px, 3vw, 32px);
  font-weight: 700;
}

.path {
  display: block;
  margin-bottom: 4px;
  font-size: 12px;
  font-weight: 700;
  letter-spacing: .14em;
  color: var(--accent);
}

h2 {
  font-size: clamp(22px, 4vw, 40px);
  line-height: 1.2;
  font-weight: 800;
  letter-spacing: -.02em;
}

.arrow {
  font-size: clamp(20px, 3vw, 28px);
  transition: transform .3s var(--ease);
}

a.item:hover .thumb img {
  transform: scale(1.05);
}

a.item:hover .arrow {
  transform: translateX(6px);
}

.soon {
  opacity: .45;
}
</style>
</head>
<body>

<header class="top wrap">
  <h1 class="reveal">LuL's Website</h1>
  <p class="sub reveal">플롯 모음집입니다.</p>
</header>

<main class="wrap">
  <ul class="list">
    <li class="reveal">
      <a class="item" href="L/">
        <div class="thumb"><img src="L/photo.jpg" alt="" loading="lazy"></div>
        <div>
          <span class="path">/L</span>
          <h2>L's Profile</h2>
        </div>
        <span class="arrow">→</span>
      </a>
    </li>
    <li class="reveal">
      <div class="item soon">
        <div class="thumb"></div>
        <div>
          <span class="path">/???</span>
          <h2>미완성 됨</h2>
        </div>
      </div>
    </li>
  </ul>
</main>

<footer class="wrap">
  <span>© 2026 Lu</span>
</footer>

<script src="assets/dream.js"></script>
</body>
</html>
